services:
  postgresql:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${BITENARY_DB:-bitenary}
      POSTGRES_USER: ${BITENARY_DB_USER:-bitenary}
      POSTGRES_PASSWORD: ${BITENARY_DB_PASSWORD:-bitenary}
    ports:
      - ${BITENARY_DB_PORT:-5433}:5432
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - bitenary_database:/var/lib/postgresql/data

  redis:
    image: docker.io/library/redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - ${BITENARY_REDIS_PORT:-6379}:6379
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - bitenary_redis:/data

volumes:
  bitenary_database:
    driver: local
  bitenary_redis:
    driver: local
